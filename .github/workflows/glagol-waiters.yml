name: Glagol waiter lifecycle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  waiters:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install transport dependencies
        run: python -m pip install 'aiohttp>=3.10,<4' 'zeroconf>=0.130,<1'
      - name: Exercise actual Glagol send and receive lifecycle
        run: python tests/test_glagol_waiters.py -v
