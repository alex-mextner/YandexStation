name: Sync fork with upstream (rebase-preserving patch)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/AlexxIT/YandexStation.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Rebase local patch onto upstream
        id: rebase
        run: |
          if git rebase upstream/master; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open conflict issue
        if: steps.rebase.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Rebase conflict: fork is behind upstream and cannot auto-sync" \
            --body "The scheduled sync workflow tried to rebase the local patch (\`manual local speaker IP fallback for Docker networks\`) onto \`upstream/master\` (AlexxIT/YandexStation) and hit a conflict. Auto-rebase was aborted — nothing was force-pushed. Resolve manually: \`git fetch upstream && git rebase upstream/master\`, fix conflicts, force-push, then re-run this workflow (or let it succeed on the next scheduled run)."

      - name: Fail job on conflict
        if: steps.rebase.outputs.clean == 'false'
        run: exit 1

      - name: Force-push rebased branch
        if: steps.rebase.outputs.clean == 'true'
        run: git push --force-with-lease origin HEAD:master

      - name: Read version from manifest
        if: steps.rebase.outputs.clean == 'true'
        id: version
        run: |
          MANIFEST=$(find . -maxdepth 3 -iname manifest.json -path '*yandex_station*' | head -1)
          VERSION=$(python3 -c "import json;print(json.load(open('$MANIFEST'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create matching release
        if: steps.rebase.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG (synced with upstream + local patch)" \
              --notes "Auto-synced from AlexxIT/YandexStation, rebasing the local IP-fallback patch on top. Generated by sync-upstream.yml."
          else
            echo "Release $TAG already exists, skipping."
          fi
